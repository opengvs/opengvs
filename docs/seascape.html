<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>WebGL 海浪海浪仿真程序</title>
<style>
  :root{
    --panel-bg: rgba(255,255,255,0.72);
    --panel-border: rgba(255,255,255,0.85);
    --text: #1c2430;
    --text-dim: #5b6675;
    --accent: #0f7fb5;
  }
  *{ box-sizing: border-box; margin:0; padding:0; }
  html,body{ width:100%; height:100%; overflow:hidden; background:#0a1a26; }
  body{
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
    color: var(--text);
    -webkit-user-select:none; user-select:none;
  }
  #glcanvas{ position:fixed; inset:0; width:100%; height:100%; display:block; cursor:crosshair; }

  .glass{
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    border-radius: 14px;
    backdrop-filter: blur(14px) saturate(1.3);
    -webkit-backdrop-filter: blur(14px) saturate(1.3);
    box-shadow: 0 6px 28px rgba(6,26,40,0.22);
  }

  /* ---------- 左上角信息 ---------- */
  #hud{
    position:fixed; top:16px; left:16px; padding:10px 14px;
    font-size:12px; line-height:1.6; letter-spacing:.2px;
    pointer-events:none;
  }
  #hud .title{ font-size:13px; font-weight:600; letter-spacing:1px; }
  #hud .sub{ color:var(--text-dim); font-size:11px; }
  #fps{ font-variant-numeric: tabular-nums; color:var(--accent); font-weight:600; }

  /* ---------- 右上角控制面板 ---------- */
  #panel{
    position:fixed; top:16px; right:16px; width:270px;
    padding:14px 16px 16px; font-size:12px;
    max-height: calc(100vh - 32px); overflow-y:auto;
  }
  #panel h2{
    font-size:12px; font-weight:600; letter-spacing:1px;
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:10px;
  }
  #toggleBtn{
    border:none; background:rgba(15,127,181,.12); color:var(--accent);
    font-size:11px; padding:3px 9px; border-radius:7px; cursor:pointer;
    font-family:inherit;
  }
  #toggleBtn:hover{ background:rgba(15,127,181,.22); }
  #panelBody.collapsed{ display:none; }

  .row{ margin-bottom:11px; }
  .row label{
    display:flex; justify-content:space-between; align-items:baseline;
    color:var(--text-dim); margin-bottom:5px; font-size:11px;
  }
  .row label b{ color:var(--text); font-weight:600; font-variant-numeric:tabular-nums; }
  input[type=range]{
    width:100%; height:4px; -webkit-appearance:none; appearance:none;
    background:rgba(28,36,48,.16); border-radius:3px; outline:none;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; width:14px; height:14px; border-radius:50%;
    background:var(--accent); cursor:pointer; box-shadow:0 1px 4px rgba(0,0,0,.25);
  }
  input[type=range]::-moz-range-thumb{
    width:14px; height:14px; border:none; border-radius:50%;
    background:var(--accent); cursor:pointer;
  }
  .seg{ display:flex; gap:5px; }
  .seg button{
    flex:1; padding:5px 0; font-size:11px; font-family:inherit; cursor:pointer;
    border:1px solid rgba(28,36,48,.14); background:rgba(255,255,255,.5);
    color:var(--text-dim); border-radius:8px;
  }
  .seg button.on{ background:var(--accent); color:#fff; border-color:var(--accent); }
  .actions{ display:flex; gap:6px; margin-top:12px; }
  .actions button{
    flex:1; padding:7px 0; font-size:11px; font-family:inherit; cursor:pointer;
    border:1px solid rgba(28,36,48,.14); background:rgba(255,255,255,.55);
    color:var(--text); border-radius:9px;
  }
  .actions button:hover{ background:#fff; }
  .hint{ color:var(--text-dim); font-size:10.5px; line-height:1.7; margin-top:11px;
         border-top:1px solid rgba(28,36,48,.1); padding-top:9px; }
  kbd{
    background:rgba(28,36,48,.08); border-radius:4px; padding:1px 5px;
    font-family:inherit; font-size:10px;
  }
  .hidden{ display:none !important; }
  #err{
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    background:#0a1a26; color:#cfe6f2; font-size:14px; text-align:center; padding:40px;
  }
</style>
</head>
<body>

<canvas id="glcanvas"></canvas>

<div id="hud" class="glass">
  <div class="title">SEASCAPE · WebGL</div>
  <div class="sub"><span id="fps">--</span> FPS &nbsp;·&nbsp; <span id="res">--</span> &nbsp;·&nbsp; <span id="api">--</span></div>
</div>

<div id="panel" class="glass">
  <h2>参数调节 <button id="toggleBtn">收起</button></h2>
  <div id="panelBody">

    <div class="row">
      <label>渲染质量</label>
      <div class="seg" id="qualitySeg">
        <button data-q="0">低</button>
        <button data-q="1">中</button>
        <button data-q="2" class="on">高</button>
        <button data-q="3">极致</button>
      </div>
    </div>

    <div class="row">
      <label>波高 SEA_HEIGHT <b id="v_height">0.60</b></label>
      <input type="range" id="s_height" min="0.05" max="2.0" step="0.01" value="0.6">
    </div>
    <div class="row">
      <label>浪尖锐度 SEA_CHOPPY <b id="v_choppy">4.00</b></label>
      <input type="range" id="s_choppy" min="0.5" max="8.0" step="0.05" value="4.0">
    </div>
    <div class="row">
      <label>波动速度 SEA_SPEED <b id="v_speed">0.80</b></label>
      <input type="range" id="s_speed" min="0.0" max="3.0" step="0.01" value="0.8">
    </div>
    <div class="row">
      <label>波频率 SEA_FREQ <b id="v_freq">0.160</b></label>
      <input type="range" id="s_freq" min="0.02" max="0.6" step="0.005" value="0.16">
    </div>
    <div class="row">
      <label>镜头前进速度 <b id="v_cam">1.00</b></label>
      <input type="range" id="s_cam" min="0.0" max="3.0" step="0.01" value="1.0">
    </div>
    <div class="row">
      <label>相机高度 <b id="v_eye">3.50</b></label>
      <input type="range" id="s_eye" min="0.5" max="12.0" step="0.1" value="3.5">
    </div>
    <div class="row">
      <label>Gamma <b id="v_gamma">0.65</b></label>
      <input type="range" id="s_gamma" min="0.3" max="1.2" step="0.01" value="0.65">
    </div>

    <div class="actions">
      <button id="btnPause">暂停</button>
      <button id="btnReset">重置</button>
      <button id="btnShot">截图</button>
    </div>
    <div class="actions">
      <button id="btnFull">全屏</button>
    </div>

    <div class="hint">
      <kbd>移动鼠标</kbd> 改变视角偏移 &nbsp; <kbd>空格</kbd> 暂停<br>
      <kbd>F</kbd> 全屏 &nbsp; <kbd>H</kbd> 隐藏界面 &nbsp; <kbd>R</kbd> 重置
    </div>
  </div>
</div>

<script>
"use strict";

//=============================================================================
// 片元着色器主体 (由 shader.frag 移植, 与 GLSL ES 兼容)
//=============================================================================
const FRAG_BODY = `
uniform vec2  uResolution;
uniform float uTime;
uniform vec4  uMouse;

uniform float uSeaHeight;
uniform float uSeaChoppy;
uniform float uSeaSpeed;
uniform float uSeaFreq;
uniform float uCamSpeed;
uniform float uEyeHeight;
uniform float uGamma;

const float PI      = 3.141592;
const float EPSILON = 1e-3;

const vec3 SEA_BASE        = vec3(0.0, 0.09, 0.18);
const vec3 SEA_WATER_COLOR = vec3(0.8, 0.9, 0.6) * 0.6;
#define SEA_TIME (1.0 + uTime * uSeaSpeed)
const mat2 octave_m = mat2(1.6, 1.2, -1.2, 1.6);

// ---- 数学工具 ----
mat3 fromEuler(vec3 ang) {
    vec2 a1 = vec2(sin(ang.x), cos(ang.x));
    vec2 a2 = vec2(sin(ang.y), cos(ang.y));
    vec2 a3 = vec2(sin(ang.z), cos(ang.z));
    mat3 m;
    m[0] = vec3(a1.y*a3.y + a1.x*a2.x*a3.x, a1.y*a2.x*a3.x + a3.y*a1.x, -a2.y*a3.x);
    m[1] = vec3(-a2.y*a1.x, a1.y*a2.y, a2.x);
    m[2] = vec3(a3.y*a1.x*a2.x + a1.y*a3.x, a1.x*a3.x - a1.y*a3.y*a2.x, a2.y*a3.y);
    return m;
}

float hash(vec2 p) {
    float h = dot(p, vec2(127.1, 311.7));
    return fract(sin(h) * 43758.5453123);
}

float noise(in vec2 p) {
    vec2 i = floor(p);
    vec2 f = fract(p);
    vec2 u = f * f * (3.0 - 2.0 * f);
    return -1.0 + 2.0 * mix(
        mix(hash(i + vec2(0.0, 0.0)), hash(i + vec2(1.0, 0.0)), u.x),
        mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), u.x),
        u.y);
}

// ---- 光照 ----
float diffuse(vec3 n, vec3 l, float p) {
    return pow(dot(n, l) * 0.4 + 0.6, p);
}
float specular(vec3 n, vec3 l, vec3 e, float s) {
    float nrm = (s + 8.0) / (PI * 8.0);
    return pow(max(dot(reflect(e, n), l), 0.0), s) * nrm;
}

// ---- 天空 ----
vec3 getSkyColor(vec3 e) {
    e.y = (max(e.y, 0.0) * 0.8 + 0.2) * 0.8;
    return vec3(pow(1.0 - e.y, 2.0), 1.0 - e.y, 0.6 + (1.0 - e.y) * 0.4) * 1.1;
}

// ---- 波浪 ----
float sea_octave(vec2 uv, float choppy) {
    uv += noise(uv);
    vec2 wv  = 1.0 - abs(sin(uv));
    vec2 swv = abs(cos(uv));
    wv = mix(wv, swv, wv);
    return pow(1.0 - pow(wv.x * wv.y, 0.65), choppy);
}

float map(vec3 p) {
    float freq   = uSeaFreq;
    float amp    = uSeaHeight;
    float choppy = uSeaChoppy;
    vec2 uv = p.xz; uv.x *= 0.75;
    float d, h = 0.0;
    for (int i = 0; i < ITER_GEOMETRY; i++) {
        d  = sea_octave((uv + SEA_TIME) * freq, choppy);
        d += sea_octave((uv - SEA_TIME) * freq, choppy);
        h += d * amp;
        uv *= octave_m; freq *= 1.9; amp *= 0.22;
        choppy = mix(choppy, 1.0, 0.2);
    }
    return p.y - h;
}

float map_detailed(vec3 p) {
    float freq   = uSeaFreq;
    float amp    = uSeaHeight;
    float choppy = uSeaChoppy;
    vec2 uv = p.xz; uv.x *= 0.75;
    float d, h = 0.0;
    for (int i = 0; i < ITER_FRAGMENT; i++) {
        d  = sea_octave((uv + SEA_TIME) * freq, choppy);
        d += sea_octave((uv - SEA_TIME) * freq, choppy);
        h += d * amp;
        uv *= octave_m; freq *= 1.9; amp *= 0.22;
        choppy = mix(choppy, 1.0, 0.2);
    }
    return p.y - h;
}

// ---- 海面着色 ----
vec3 getSeaColor(vec3 p, vec3 n, vec3 l, vec3 eye, vec3 dist) {
    float fresnel = clamp(1.0 - dot(n, -eye), 0.0, 1.0);
    fresnel = min(fresnel * fresnel * fresnel, 0.5);

    vec3 reflected = getSkyColor(reflect(eye, n));
    vec3 refracted = SEA_BASE + diffuse(n, l, 80.0) * SEA_WATER_COLOR * 0.12;

    vec3 color = mix(refracted, reflected, fresnel);

    float atten = max(1.0 - dot(dist, dist) * 0.001, 0.0);
    color += SEA_WATER_COLOR * (p.y - uSeaHeight) * 0.18 * atten;
    color += specular(n, l, eye, 600.0 * inversesqrt(dot(dist, dist)));
    return color;
}

// ---- 追踪 ----
vec3 getNormal(vec3 p, float eps) {
    vec3 n;
    n.y = map_detailed(p);
    n.x = map_detailed(vec3(p.x + eps, p.y, p.z)) - n.y;
    n.z = map_detailed(vec3(p.x, p.y, p.z + eps)) - n.y;
    n.y = eps;
    return normalize(n);
}

float heightMapTracing(vec3 ori, vec3 dir, out vec3 p) {
    float tm = 0.0;
    float tx = 1000.0;
    float hx = map(ori + dir * tx);
    if (hx > 0.0) { p = ori + dir * tx; return tx; }
    float hm = map(ori);
    for (int i = 0; i < NUM_STEPS; i++) {
        float tmid = mix(tm, tx, hm / (hm - hx));
        p = ori + dir * tmid;
        float hmid = map(p);
        if (hmid < 0.0) { tx = tmid; hx = hmid; }
        else            { tm = tmid; hm = hmid; }
        if (abs(hmid) < EPSILON) break;
    }
    return mix(tm, tx, hm / (hm - hx));
}

// ---- 像素着色 ----
vec3 getPixel(in vec2 coord, float time) {
    vec2 uv = coord / uResolution.xy;
    uv = uv * 2.0 - 1.0;
    uv.x *= uResolution.x / uResolution.y;

    vec3 ang = vec3(sin(time * 3.0) * 0.1, sin(time) * 0.2 + 0.3, time);
    vec3 ori = vec3(0.0, uEyeHeight, time * 5.0 * uCamSpeed);
    vec3 dir = normalize(vec3(uv.xy, -2.0));
    dir.z += length(uv) * 0.14;
    dir = normalize(dir) * fromEuler(ang);

    vec3 p;
    heightMapTracing(ori, dir, p);
    vec3 dist  = p - ori;
    vec3 n     = getNormal(p, dot(dist, dist) * (0.1 / uResolution.x));
    vec3 light = normalize(vec3(0.0, 1.0, 0.8));

    return mix(
        getSkyColor(dir),
        getSeaColor(p, n, light, dir, dist),
        pow(smoothstep(0.0, -0.02, dir.y), 0.2));
}

void main() {
    float time = uTime * 0.3 + uMouse.x * 0.01;
    vec3 color = getPixel(gl_FragCoord.xy, time);
    fragColor = vec4(pow(color, vec3(uGamma)), 1.0);
}
`;

//=============================================================================
// WebGL 初始化
//=============================================================================
const canvas = document.getElementById('glcanvas');
let isGL2 = true;
let gl = canvas.getContext('webgl2', { antialias:false, alpha:false, powerPreference:'high-performance' });
if (!gl) {
  isGL2 = false;
  gl = canvas.getContext('webgl', { antialias:false, alpha:false, powerPreference:'high-performance' })
    || canvas.getContext('experimental-webgl');
}
if (!gl) {
  document.body.innerHTML = '<div id="err">当前浏览器不支持 WebGL，无法运行本页面。<br>请使用较新版本的 Chrome / Edge / Firefox / Safari。</div>';
  throw new Error('no webgl');
}
document.getElementById('api').textContent = isGL2 ? 'WebGL 2' : 'WebGL 1';

function buildVert() {
  return isGL2
    ? `#version 300 es
in vec2 aPos;
void main(){ gl_Position = vec4(aPos, 0.0, 1.0); }`
    : `attribute vec2 aPos;
void main(){ gl_Position = vec4(aPos, 0.0, 1.0); }`;
}

function buildFrag(q) {
  const defines =
    `#define ITER_GEOMETRY ${q.iterGeom}\n` +
    `#define ITER_FRAGMENT ${q.iterFrag}\n` +
    `#define NUM_STEPS ${q.steps}\n`;

  const head = isGL2
    ? `#version 300 es
precision highp float;
precision highp int;
out vec4 fragColor;
`
    : `#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif
#define fragColor gl_FragColor
`;
  return head + defines + FRAG_BODY;
}

function compile(type, src) {
  const sh = gl.createShader(type);
  gl.shaderSource(sh, src);
  gl.compileShader(sh);
  if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
    console.error(gl.getShaderInfoLog(sh));
    console.error(src.split('\n').map((l,i)=>(i+1)+': '+l).join('\n'));
    gl.deleteShader(sh);
    return null;
  }
  return sh;
}

let program = null, uni = {};
function buildProgram(q) {
  const vs = compile(gl.VERTEX_SHADER, buildVert());
  const fs = compile(gl.FRAGMENT_SHADER, buildFrag(q));
  if (!vs || !fs) return false;
  const p = gl.createProgram();
  gl.attachShader(p, vs); gl.attachShader(p, fs);
  gl.bindAttribLocation(p, 0, 'aPos');
  gl.linkProgram(p);
  gl.deleteShader(vs); gl.deleteShader(fs);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
    console.error(gl.getProgramInfoLog(p));
    gl.deleteProgram(p);
    return false;
  }
  if (program) gl.deleteProgram(program);
  program = p;
  gl.useProgram(program);
  uni = {};
  ['uResolution','uTime','uMouse','uSeaHeight','uSeaChoppy','uSeaSpeed',
   'uSeaFreq','uCamSpeed','uEyeHeight','uGamma'].forEach(n => {
    uni[n] = gl.getUniformLocation(program, n);
  });
  return true;
}

// 全屏四边形
const vbo = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
if (isGL2) {
  const vao = gl.createVertexArray();
  gl.bindVertexArray(vao);
  gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
}
gl.enableVertexAttribArray(0);
gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

//=============================================================================
// 状态与参数
//=============================================================================
const QUALITY = [
  { name:'低',   iterGeom:2, iterFrag:3, steps:8,  scale:0.55, maxDpr:1   },
  { name:'中',   iterGeom:3, iterFrag:4, steps:16, scale:0.8,  maxDpr:1.25},
  { name:'高',   iterGeom:3, iterFrag:5, steps:32, scale:1.0,  maxDpr:1.5 },
  { name:'极致', iterGeom:4, iterFrag:6, steps:48, scale:1.0,  maxDpr:2   }
];

const DEFAULTS = { height:0.6, choppy:4.0, speed:0.8, freq:0.16, cam:1.0, eye:3.5, gamma:0.65 };
const params = Object.assign({}, DEFAULTS);

let qIndex = 2;
let time = 0, lastT = performance.now(), paused = false;
let mouseX = 0, mouseY = 0, targetMouseX = 0, mouseDown = 0;
let pendingShot = false;

buildProgram(QUALITY[qIndex]);

//=============================================================================
// 尺寸
//=============================================================================
function resize() {
  const q = QUALITY[qIndex];
  const dpr = Math.min(window.devicePixelRatio || 1, q.maxDpr);
  const w = Math.max(1, Math.round(canvas.clientWidth  * dpr * q.scale));
  const h = Math.max(1, Math.round(canvas.clientHeight * dpr * q.scale));
  if (canvas.width !== w || canvas.height !== h) {
    canvas.width = w; canvas.height = h;
    document.getElementById('res').textContent = w + '×' + h;
  }
}
window.addEventListener('resize', resize);

//=============================================================================
// 渲染循环
//=============================================================================
function frame(now) {
  const dt = Math.min((now - lastT) / 1000, 0.1);
  lastT = now;
  if (!paused) time += dt;

  // 鼠标平滑
  mouseX += (targetMouseX - mouseX) * Math.min(dt * 6, 1);

  resize();
  gl.viewport(0, 0, canvas.width, canvas.height);
  gl.useProgram(program);

  gl.uniform2f(uni.uResolution, canvas.width, canvas.height);
  gl.uniform1f(uni.uTime, time);
  gl.uniform4f(uni.uMouse, mouseX, mouseY, mouseDown, 0);
  gl.uniform1f(uni.uSeaHeight, params.height);
  gl.uniform1f(uni.uSeaChoppy, params.choppy);
  gl.uniform1f(uni.uSeaSpeed,  params.speed);
  gl.uniform1f(uni.uSeaFreq,   params.freq);
  gl.uniform1f(uni.uCamSpeed,  params.cam);
  gl.uniform1f(uni.uEyeHeight, params.eye);
  gl.uniform1f(uni.uGamma,     params.gamma);

  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

  if (pendingShot) { pendingShot = false; doShot(); }

  // FPS
  fpsFrames++;
  if (now - fpsLast >= 500) {
    document.getElementById('fps').textContent = (fpsFrames * 1000 / (now - fpsLast)).toFixed(0);
    fpsFrames = 0; fpsLast = now;
  }
  requestAnimationFrame(frame);
}
let fpsFrames = 0, fpsLast = performance.now();
requestAnimationFrame(frame);

//=============================================================================
// 交互
//=============================================================================
canvas.addEventListener('mousemove', e => {
  targetMouseX = e.clientX;
  mouseY = e.clientY;
});
canvas.addEventListener('mousedown', () => { mouseDown = 1; targetMouseX = window.innerWidth * 0.5; });
window.addEventListener('mouseup',   () => { mouseDown = 0; });
canvas.addEventListener('touchmove', e => {
  if (e.touches[0]) { targetMouseX = e.touches[0].clientX; mouseY = e.touches[0].clientY; }
  e.preventDefault();
}, { passive:false });

function bindSlider(id, key, label, digits) {
  const s = document.getElementById(id);
  const v = document.getElementById(label);
  const upd = () => { params[key] = parseFloat(s.value); v.textContent = params[key].toFixed(digits); };
  s.addEventListener('input', upd);
  upd();
  return s;
}
const sliders = {
  height: bindSlider('s_height','height','v_height',2),
  choppy: bindSlider('s_choppy','choppy','v_choppy',2),
  speed:  bindSlider('s_speed','speed','v_speed',2),
  freq:   bindSlider('s_freq','freq','v_freq',3),
  cam:    bindSlider('s_cam','cam','v_cam',2),
  eye:    bindSlider('s_eye','eye','v_eye',2),
  gamma:  bindSlider('s_gamma','gamma','v_gamma',2)
};

document.querySelectorAll('#qualitySeg button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#qualitySeg button').forEach(b => b.classList.remove('on'));
    btn.classList.add('on');
    qIndex = parseInt(btn.dataset.q, 10);
    buildProgram(QUALITY[qIndex]);
    resize();
  });
});

const btnPause = document.getElementById('btnPause');
btnPause.addEventListener('click', togglePause);
function togglePause() {
  paused = !paused;
  btnPause.textContent = paused ? '继续' : '暂停';
}

document.getElementById('btnReset').addEventListener('click', reset);
function reset() {
  Object.assign(params, DEFAULTS);
  for (const k in sliders) {
    sliders[k].value = DEFAULTS[k];
    sliders[k].dispatchEvent(new Event('input'));
  }
  time = 0; targetMouseX = 0; mouseX = 0;
}

document.getElementById('btnShot').addEventListener('click', () => { pendingShot = true; });
function doShot() {
  canvas.toBlob(b => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(b);
    a.download = 'seascape_' + Date.now() + '.png';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }, 'image/png');
}

const btnFull = document.getElementById('btnFull');
function updateFullBtn() {
  btnFull.textContent = document.fullscreenElement ? '退出全屏' : '全屏';
}
function toggleFullscreen() {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen().catch(() => {});
}
btnFull.addEventListener('click', toggleFullscreen);
document.addEventListener('fullscreenchange', updateFullBtn);

const toggleBtn = document.getElementById('toggleBtn');
toggleBtn.addEventListener('click', () => {
  const body = document.getElementById('panelBody');
  body.classList.toggle('collapsed');
  toggleBtn.textContent = body.classList.contains('collapsed') ? '展开' : '收起';
});

window.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === ' ')      { e.preventDefault(); togglePause(); }
  else if (k === 'f') { toggleFullscreen(); }
  else if (k === 'h') { document.getElementById('panel').classList.toggle('hidden');
                        document.getElementById('hud').classList.toggle('hidden'); }
  else if (k === 'r') { reset(); }
});

resize();
</script>
</body>
</html>
