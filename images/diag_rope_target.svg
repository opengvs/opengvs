<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" font-family="Segoe UI, Microsoft YaHei, sans-serif">
  <rect width="680" height="320" fill="#ffffff"/>
  <text x="24" y="32" font-size="20" font-weight="bold" fill="#1a1a1a">RoPE 作用在哪个张量？（x 不转，只转 Q、K）</text>

  <!-- x 残差流 -->
  <rect x="24" y="70" width="200" height="60" rx="6" fill="#eceff1" stroke="#607d8b" stroke-width="1.5"/>
  <text x="40" y="96" font-size="13" font-weight="bold" fill="#37474f">残差流 x [1,N,4096]</text>
  <text x="40" y="116" font-size="11" fill="#555">承载 token 语义 → 不旋转</text>

  <!-- Wq Wk -->
  <rect x="250" y="70" width="170" height="60" rx="6" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="266" y="96" font-size="13" fill="#222">Q=x·Wq  K=x·Wk</text>
  <text x="266" y="116" font-size="11" fill="#555">各自 [1,N,4096]</text>

  <!-- 旋转 -->
  <rect x="450" y="70" width="120" height="60" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="466" y="96" font-size="13" font-weight="bold" fill="#1b5e20">RoPE 旋转</text>
  <text x="466" y="116" font-size="11" fill="#555">仅 Q、K</text>

  <!-- Q'K' -->
  <rect x="596" y="70" width="68" height="60" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="608" y="100" font-size="12" fill="#0d47a1">Q' K'</text>

  <g stroke="#444" stroke-width="2" marker-end="url(#ar)">
    <line x1="224" y1="100" x2="248" y2="100"/>
    <line x1="420" y1="100" x2="448" y2="100"/>
    <line x1="570" y1="100" x2="594" y2="100"/>
  </g>
  <defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#444"/></marker></defs>

  <!-- 说明 -->
  <rect x="24" y="170" width="632" height="120" rx="10" fill="#fafafa" stroke="#bbb" stroke-width="1.5"/>
  <text x="40" y="198" font-size="14" font-weight="bold" fill="#333">旋转的是"从 x 投影出的 Q、K"，不是 token 嵌入向量本身</text>
  <text x="40" y="226" font-size="13" fill="#222">• x（残差流）本身不被旋转，它只是被拿去乘 Wq / Wk</text>
  <text x="40" y="252" font-size="13" fill="#222">• Q'、K'（各 [1,N,4096]）才在每层注意力里按位置旋转；V 也不旋转</text>
  <text x="40" y="278" font-size="13" fill="#222">• 每层的 Q、K 都要重新旋一次（因 x 每层被上一层的注意力改过）</text>

  <text x="24" y="312" font-size="12" fill="#888">按"头"独立做：4096 维切 32 头×128 维，每头在自己 128 维内部（64 对）旋转，拼回仍是 [1,N,4096]。</text>
</svg>
