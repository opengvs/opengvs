<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" font-family="Segoe UI, Microsoft YaHei, sans-serif">
  <rect width="680" height="360" fill="#ffffff"/>
  <text x="24" y="32" font-size="20" font-weight="bold" fill="#1a1a1a">FFN 子层结构（逐 token 独立深加工）</text>

  <!-- x -->
  <rect x="30" y="80" width="120" height="50" rx="6" fill="#eceff1" stroke="#607d8b" stroke-width="1.5"/>
  <text x="58" y="110" font-size="13" fill="#222">x [5,32]</text>

  <!-- W1 -->
  <rect x="180" y="80" width="130" height="50" rx="6" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="200" y="104" font-size="13" fill="#222">h = x·W1</text>
  <text x="200" y="122" font-size="11" fill="#555">[5,32] 矩阵乘</text>

  <!-- 激活 -->
  <rect x="330" y="80" width="120" height="50" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="350" y="104" font-size="13" fill="#222">a = 激活(h)</text>
  <text x="350" y="122" font-size="11" fill="#555">GELU/SiLU</text>

  <!-- W2 -->
  <rect x="470" y="80" width="140" height="50" rx="6" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="490" y="104" font-size="13" fill="#222">FFN_out=a·W2</text>
  <text x="490" y="122" font-size="11" fill="#555">[5,32] 矩阵乘</text>

  <g stroke="#444" stroke-width="2" marker-end="url(#ar)">
    <line x1="150" y1="105" x2="178" y2="105"/>
    <line x1="310" y1="105" x2="328" y2="105"/>
    <line x1="450" y1="105" x2="468" y2="105"/>
  </g>
  <defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#444"/></marker></defs>

  <!-- 残差 -->
  <path d="M90 130 C 90 180, 540 180, 540 130" fill="none" stroke="#ef6c00" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#aro)"/>
  <defs><marker id="aro" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#ef6c00"/></marker></defs>
  <rect x="30" y="210" width="620" height="50" rx="8" fill="#fff3e0" stroke="#ef6c00" stroke-width="1.5"/>
  <text x="46" y="240" font-size="13" fill="#222">残差相加：out = x + FFN_out  →  仍是 [5,32]（橙色虚线 = 残差支路，x 直接绕过来加回）</text>

  <!-- 对照表 -->
  <rect x="30" y="280" width="620" height="64" rx="8" fill="#fafafa" stroke="#bbb" stroke-width="1"/>
  <text x="46" y="304" font-size="13" font-weight="bold" fill="#333">FFN vs 注意力子层</text>
  <text x="46" y="326" font-size="12.5" fill="#222">注意力：跨 token 混合（[5,5] 路由表，token 互看）　|　FFN：逐 token 独立（每个 token 各过 W1→σ→W2，互不看）</text>
  <text x="46" y="344" font-size="12.5" fill="#222">二者互补：注意力管"token 间通信"，FFN 管"token 内提炼"。激活的非线性让多层不退化为一层。</text>
</svg>
