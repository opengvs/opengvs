<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="Segoe UI, Microsoft YaHei, sans-serif">
  <rect width="680" height="400" fill="#ffffff"/>
  <text x="24" y="32" font-size="20" font-weight="bold" fill="#1a1a1a">输出层：残差流 [1,N,32] → 新 token 序列</text>

  <!-- 残差流 -->
  <rect x="24" y="70" width="200" height="60" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="40" y="96" font-size="13" font-weight="bold" fill="#1b5e20">最后一层输出 [1,N,32]</text>
  <text x="40" y="116" font-size="11" fill="#555">N 个 token 并排，形状不变</text>

  <!-- 取最后 -->
  <rect x="260" y="70" width="140" height="60" rx="6" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="1.5"/>
  <text x="276" y="96" font-size="13" font-weight="bold" fill="#4a148c">取最后位置</text>
  <text x="276" y="116" font-size="11" fill="#555">切片 → [1,32]</text>

  <!-- lm_head -->
  <rect x="430" y="70" width="140" height="60" rx="6" fill="#e0f7fa" stroke="#00838f" stroke-width="1.5"/>
  <text x="446" y="96" font-size="13" font-weight="bold" fill="#006064">lm_head</text>
  <text x="446" y="116" font-size="11" fill="#555">[1,32]×W→[1,12]</text>

  <!-- softmax -->
  <rect x="600" y="70" width="70" height="60" rx="6" fill="#fff3e0" stroke="#ef6c00" stroke-width="1.5"/>
  <text x="612" y="104" font-size="12" fill="#e65100">softmax</text>

  <g stroke="#444" stroke-width="2" marker-end="url(#ar)">
    <line x1="224" y1="100" x2="258" y2="100"/>
    <line x1="400" y1="100" x2="428" y2="100"/>
    <line x1="570" y1="100" x2="598" y2="100"/>
  </g>
  <defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#444"/></marker></defs>

  <!-- 采样 -->
  <rect x="600" y="160" width="70" height="50" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="614" y="190" font-size="12" fill="#1b5e20">采样</text>

  <!-- 自回归 -->
  <rect x="24" y="250" width="632" height="110" rx="10" fill="#fafafa" stroke="#bbb" stroke-width="1.5"/>
  <text x="40" y="276" font-size="14" font-weight="bold" fill="#333">自回归循环（KV cache 加速）</text>
  <text x="40" y="302" font-size="13" fill="#222">"1+2+3"   → 预测 '='   → 拼回</text>
  <text x="40" y="326" font-size="13" fill="#222">"1+2+3="  → 预测 '6'   → 拼回</text>
  <text x="40" y="350" font-size="13" fill="#222">"1+2+3=6" → 预测 结束符 → 停止</text>

  <text x="24" y="390" font-size="12" fill="#888">推理时只取最后位置预测"下一个"；训练时所有位置同时预测各自下一个。生成的新 token 拼回序列，循环直到 EOS。</text>
</svg>
