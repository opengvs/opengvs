<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" font-family="Segoe UI, Microsoft YaHei, sans-serif">
  <rect width="680" height="380" fill="#ffffff"/>
  <text x="24" y="32" font-size="20" font-weight="bold" fill="#1a1a1a">RoPE 旋转编码原理（把"第几位"变成"向量旋转角"）</text>

  <!-- 左：2D 旋转 -->
  <text x="40" y="70" font-size="14" font-weight="bold" fill="#333">① 一对维度 = 2D 平面上的坐标</text>
  <circle cx="180" cy="220" r="120" fill="#fafafa" stroke="#ccc" stroke-width="1.5"/>
  <line x1="60" y1="220" x2="300" y2="220" stroke="#999" stroke-width="1"/>
  <line x1="180" y1="100" x2="180" y2="340" stroke="#999" stroke-width="1"/>
  <!-- 向量 m=0 -->
  <line x1="180" y1="220" x2="250" y2="160" stroke="#1565c0" stroke-width="3" marker-end="url(#b)"/>
  <text x="252" y="156" font-size="12" fill="#1565c0">pos m=0 (不转)</text>
  <!-- 向量 m=1 -->
  <line x1="180" y1="220" x2="120" y2="150" stroke="#e65100" stroke-width="3" marker-end="url(#o)"/>
  <text x="40" y="142" font-size="12" fill="#e65100">pos m=1 (转 θ)</text>
  <!-- 弧 -->
  <path d="M 230 185 A 60 60 0 0 0 165 162" fill="none" stroke="#888" stroke-width="1.5"/>
  <text x="190" y="150" font-size="12" fill="#888">θ</text>

  <defs>
    <marker id="b" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#1565c0"/></marker>
    <marker id="o" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#e65100"/></marker>
  </defs>

  <!-- 右：公式 -->
  <text x="380" y="80" font-size="14" font-weight="bold" fill="#333">② 每对 (x₂ᵢ, x₂ᵢ₊₁) 旋转 m·θᵢ</text>
  <rect x="380" y="96" width="280" height="120" rx="8" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="1.5"/>
  <text x="396" y="124" font-size="13" fill="#222">θ_i = base^(−2i/d)   (base=10000)</text>
  <text x="396" y="150" font-size="13" fill="#222">x'₂ᵢ   = x₂ᵢ·cos(mθᵢ) − x₂ᵢ₊₁·sin(mθᵢ)</text>
  <text x="396" y="174" font-size="13" fill="#222">x'₂ᵢ₊₁ = x₂ᵢ·sin(mθᵢ) + x₂ᵢ₊₁·cos(mθᵢ)</text>
  <text x="396" y="200" font-size="12" fill="#555">16 对（d=32）各按自己的 θᵢ 旋转</text>

  <text x="380" y="250" font-size="14" font-weight="bold" fill="#333">③ 为什么相对位置自己冒出来</text>
  <rect x="380" y="266" width="280" height="80" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="396" y="294" font-size="13" fill="#222">R(m)ᵀ · R(n) = R(n−m)</text>
  <text x="396" y="318" font-size="13" fill="#222">Q'[m]·K'[n] = Q·R(n−m)·K</text>
  <text x="396" y="338" font-size="12" fill="#555">点积只含相对距离 n−m</text>

  <text x="24" y="365" font-size="12" fill="#888">只作用于每一层的 Q、K（V 与残差流 x 不转），无学习参数；每层重新旋一次。</text>
</svg>
